# No `name` or custom-domain route here on purpose: scripts/deploy.sh passes
# both as CLI flags (--name, --domains), sourced from CF_WORKER_NAME /
# CF_CUSTOM_DOMAIN in .env.local (local) or GitHub Secrets (CI). That keeps
# the worker's identity in one place instead of duplicated in this file too.
compatibility_date = "2026-08-09"

[assets]
directory = "./dist"
not_found_handling = "404-page"
